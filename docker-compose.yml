# Локальное окружение для тестирования.
#
#   docker compose up --build                  — только сервер (REST + MCP на :8080)
#   docker compose --profile demo up --build   — бесплатный hybrid-сценарий:
#                                                сервер + три scripted-агента
#
# Demo не требует ключей и не обращается к LLM. Чтобы заменить scripted-агентов
# реальными моделями, задайте DEMO_AGENT_PROVIDER и отдельный ключ агента:
#   DEMO_AGENT_PROVIDER=anthropic
#   DEMO_AGENT_ANTHROPIC_API_KEY=sk-ant-...
# Вопрос демо-дебатов можно переопределить: DEMO_QUESTION="..."

services:
  courtd:
    build: .
    ports:
      - "8080:8080"
    environment:
      COURT_DB: /data/court.db
      # Модератор на альтернативном провайдере (например, DeepSeek через
      # OpenRouter): задайте в .env COURT_MODERATOR_PROVIDER=openai,
      # COURT_MODERATOR_BASE_URL=https://openrouter.ai/api/v1,
      # COURT_MODERATOR_MODEL=deepseek/deepseek-v4-flash,
      # COURT_MODERATOR_API_KEY=sk-or-...
      COURT_MODERATOR_PROVIDER: ${COURT_MODERATOR_PROVIDER:-anthropic}
      COURT_MODERATOR_MODEL: ${COURT_MODERATOR_MODEL:-claude-opus-5}
      COURT_MODERATOR_BASE_URL: ${COURT_MODERATOR_BASE_URL:-}
      COURT_MODERATOR_API_KEY: ${COURT_MODERATOR_API_KEY:-}
    volumes:
      - court-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- Демо-агенты (profile: demo) ---

  agent-pragmatic:
    build: .
    profiles: [demo]
    command: [demo-agent]
    depends_on:
      courtd:
        condition: service_healthy
    environment:
      COURT_URL: http://courtd:8080
      AGENT_PROVIDER: ${DEMO_AGENT_PROVIDER:-scripted}
      AGENT_MODEL: ${DEMO_AGENT_MODEL:-claude-opus-5}
      AGENT_BASE_URL: ${DEMO_AGENT_BASE_URL:-}
      ANTHROPIC_API_KEY: ${DEMO_AGENT_ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${DEMO_AGENT_OPENAI_API_KEY:-}
      AGENT_NAME: Прагматик
      AGENT_PERSONA: >-
        Ты опытный инженер-практик. Тебя интересуют сроки, стоимость и риски
        внедрения. Не доверяешь красивым теориям без плана реализации.
      AGENT_SCRIPT: >-
        Предлагаю начать с короткого обратимого пилота: заранее определить
        измеримые критерии успеха, предел затрат и условие отката. Так мы
        проверим решение на реальной нагрузке, не превращая гипотезу в ставку
        всей команды.
      AGENT_SUPPORT_NAME: Прагматик
      # Создатель дебатов: задаёт вопрос, ждёт кворум и запускает.
      DEBATE_QUESTION: ${DEMO_QUESTION:-Стоит ли небольшой команде переходить с монолита на микросервисы?}
      DEBATE_DESCRIPTION: ${DEMO_DESCRIPTION:-}
      DEBATE_MODE: ${DEMO_MODE:-hybrid}
      DEBATE_ROUNDS: ${DEMO_ROUNDS:-2}
      DEBATE_PARTICIPANTS: 3
      TURN_TIMEOUT_SEC: ${DEMO_TURN_TIMEOUT:-120}
    restart: "no"

  agent-visionary:
    build: .
    profiles: [demo]
    command: [demo-agent]
    depends_on:
      courtd:
        condition: service_healthy
    environment:
      COURT_URL: http://courtd:8080
      AGENT_PROVIDER: ${DEMO_AGENT_PROVIDER:-scripted}
      AGENT_MODEL: ${DEMO_AGENT_MODEL:-claude-opus-5}
      AGENT_BASE_URL: ${DEMO_AGENT_BASE_URL:-}
      ANTHROPIC_API_KEY: ${DEMO_AGENT_ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${DEMO_AGENT_OPENAI_API_KEY:-}
      AGENT_NAME: Визионер
      AGENT_PERSONA: >-
        Ты мыслишь стратегически, на горизонте 3–5 лет. Ищешь решения,
        которые масштабируются, даже если сейчас они дороже.
      AGENT_SCRIPT: >-
        Поддерживаю пилот: он даст факты для долгосрочной архитектуры и покажет,
        какие части решения действительно масштабируются. Полученные метрики
        важнее преждевременного выбора окончательной платформы.
      AGENT_SUPPORT_NAME: Прагматик
    restart: "no"

  agent-skeptic:
    build: .
    profiles: [demo]
    command: [demo-agent]
    depends_on:
      courtd:
        condition: service_healthy
    environment:
      COURT_URL: http://courtd:8080
      AGENT_PROVIDER: ${DEMO_AGENT_PROVIDER:-scripted}
      AGENT_MODEL: ${DEMO_AGENT_MODEL:-claude-opus-5}
      AGENT_BASE_URL: ${DEMO_AGENT_BASE_URL:-}
      ANTHROPIC_API_KEY: ${DEMO_AGENT_ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${DEMO_AGENT_OPENAI_API_KEY:-}
      AGENT_NAME: Скептик
      AGENT_PERSONA: >-
        Ты ищешь слабые места в любых предложениях: скрытые допущения,
        непроверенные факты, риски. Твоя цель — чтобы решение выдержало критику.
      AGENT_SCRIPT: >-
        Согласен с обратимым пилотом при двух условиях: критерии остановки
        фиксируются до старта, а результат сравнивается с текущим решением.
        Иначе эксперимент подтвердит то, что команда заранее хотела увидеть.
      AGENT_SUPPORT_NAME: Прагматик
    restart: "no"

volumes:
  court-data:
